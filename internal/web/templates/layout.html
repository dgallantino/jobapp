{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{{block "title" .}}jobapp{{end}}</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <div class="wrap">
    {{if .Authed}}
    <header class="appbar">
      <a class="brand" href="/?status=new">jobapp</a>
      <nav>
        <a href="/?status=new">Jobs</a>
        <a href="/profile">Profile</a>
        <a href="/sources">Sources</a>
      </nav>
      <span class="spacer"></span>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="secondary">Log out</button>
      </form>
    </header>
    {{end}}
    {{block "content" .}}{{end}}
  </div>
  <script>
  document.addEventListener('toggle', (e) => {
    const el = e.target;
    if (!(el instanceof HTMLDetailsElement) || !el.open || !el.classList.contains('job-expand')) return;
    requestAnimationFrame(() => {
      el.closest('.job-entry')?.scrollIntoView({ block: 'start', behavior: 'instant' });
    });
  }, true);
  </script>
</body>
</html>
{{end}}
