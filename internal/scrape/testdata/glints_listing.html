<!DOCTYPE html>
<html>
<head><title>Glints Explore</title></head>
<body>
  <div class="job-list">
    <div class="CompactOpportunityCardsc__CompactJobCard-sc-example"
         data-gtm-job-id="c4cb6d60-050b-4710-9092-4e8cef9d2163"
         data-gtm-company-name="PT. Bukuku Solusi Kreatif">
      <a class="CompactOpportunityCardsc__JobCardTitleNoStyleAnchor-sc-example"
         href="/id/en/opportunities/jobs/senior-backend-developer/c4cb6d60-050b-4710-9092-4e8cef9d2163?utm_referrer=explore">
        <h2 class="CompactOpportunityCardsc__JobTitle-sc-example">Senior Backend Developer</h2>
      </a>
      <span data-cy="company_name_job_card">PT. Bukuku Solusi Kreatif</span>
      <div class="CompactOpportunityCardsc__SalaryWrapper-sc-example">
        <span class="salary">Rp 7,000,000 - 10,000,000 / Month</span>
      </div>
    </div>

    <div class="CompactOpportunityCardsc__CompactJobCard-sc-example"
         data-gtm-job-id="aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
         data-gtm-company-name="Example Corp">
      <a class="CompactOpportunityCardsc__JobCardTitleNoStyleAnchor-sc-example"
         href="/id/en/opportunities/jobs/backend-engineer/aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee">
        <h2 class="CompactOpportunityCardsc__JobTitle-sc-example">Backend Engineer</h2>
      </a>
      <span data-cy="company_name_job_card">Example Corp</span>
      <!-- no salary -->
    </div>

    <!-- duplicate card should be ignored -->
    <div class="CompactOpportunityCardsc__CompactJobCard-sc-example"
         data-gtm-job-id="c4cb6d60-050b-4710-9092-4e8cef9d2163"
         data-gtm-company-name="PT. Bukuku Solusi Kreatif">
      <a href="/id/en/opportunities/jobs/senior-backend-developer/c4cb6d60-050b-4710-9092-4e8cef9d2163">
        <h2 class="CompactOpportunityCardsc__JobTitle-sc-example">Senior Backend Developer</h2>
      </a>
    </div>
  </div>
</body>
</html>
